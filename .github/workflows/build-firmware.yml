name: Build QMK Firmware

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout QMK Firmware
        uses: actions/checkout@v4
        with:
          repository: qmk/qmk_firmware
          ref: "0.34.5"
          submodules: recursive

      - name: Checkout current repository into keyboards
        uses: actions/checkout@v4
        with:
          path: keyboards/dj

      - name: Install QMK Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip gcc-avr binutils-avr avr-libc gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi
          python3 -m pip install --upgrade qmk

      - name: Run Make
        run: make dj:work

      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: qmk-dj-firmware
          path: |
            *.hex
            *.bin
            *.uf2
          if-no-files-found: warn
